services:
  # ==================== API Gateway ====================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: coopcredit-gateway
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CREDIT_APP_URL=http://credit-application-service:8080
      - RISK_SERVICE_URL=http://risk-central-mock-service:8081
    depends_on:
      - credit-application-service
      - risk-central-mock-service
    networks:
      - coopcredit-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== Database ====================
  db:
    image: postgres:16-alpine
    container_name: coopcredit-db
    environment:
      POSTGRES_DB: coopcredit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coopcredit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Risk Central Mock Service
  risk-central-mock-service:
    build:
      context: ./risk-central-mock-service
      dockerfile: Dockerfile
    container_name: risk-central-mock
    ports:
      - "8081:8081"
    networks:
      - coopcredit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== Redis Cache ====================
  redis:
    image: redis:alpine
    container_name: coopcredit-redis
    ports:
      - "6379:6379"
    networks:
      - coopcredit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Credit Application Service
  credit-application-service:
    build:
      context: ./credit-application-service
      dockerfile: Dockerfile
    container_name: credit-application-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: coopcredit_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RISK_SERVICE_HOST: risk-central-mock-service
      RISK_SERVICE_PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      risk-central-mock-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coopcredit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  coopcredit-network:
    driver: bridge