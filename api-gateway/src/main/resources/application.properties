# ==================== Server Configuration ====================
spring.application.name=api-gateway
server.port=8090

# ==================== Gateway Routes Configuration ====================

# Credit Application Service Routes
spring.cloud.gateway.routes[0].id=credit-application-service
spring.cloud.gateway.routes[0].uri=${CREDIT_APP_URL:http://credit-application-service:8080}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/affiliates/**,/api/v1/credit-applications/**
spring.cloud.gateway.routes[0].filters[0]=AddRequestHeader=X-Gateway-Route, credit-application-service

# Risk Central Service Routes
spring.cloud.gateway.routes[1].id=risk-central-service
spring.cloud.gateway.routes[1].uri=${RISK_SERVICE_URL:http://risk-central-mock:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/risk-evaluation/**
spring.cloud.gateway.routes[1].filters[0]=AddRequestHeader=X-Gateway-Route, risk-central-service

# Credit Application Actuator
spring.cloud.gateway.routes[2].id=credit-app-actuator
spring.cloud.gateway.routes[2].uri=${CREDIT_APP_URL:http://credit-application-service:8080}
spring.cloud.gateway.routes[2].predicates[0]=Path=/services/credit-app/actuator/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/services/credit-app/actuator/(?<segment>.*), /actuator/${segment}

# Risk Service Actuator
spring.cloud.gateway.routes[3].id=risk-service-actuator
spring.cloud.gateway.routes[3].uri=${RISK_SERVICE_URL:http://risk-central-mock:8081}
spring.cloud.gateway.routes[3].predicates[0]=Path=/services/risk/actuator/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/services/risk/actuator/(?<segment>.*), /actuator/$\{segment}

# ==================== Gateway Global Settings ====================

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Default filters for all routes
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.default-filters[1]=AddResponseHeader=X-Response-Time, ${RESPONSE_TIME:unknown}

# Circuit Breaker (optional - requires spring.cloud.circuitbreaker)
# spring.cloud.gateway.default-filters[2]=name=CircuitBreaker
# spring.cloud.gateway.default-filters[2].args.name=defaultCircuitBreaker

# ==================== Actuator Configuration ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ==================== Metrics Configuration ====================
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==================== Logging Configuration ====================
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.prueba.api_gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================== Gateway Timeout Configuration ====================
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30s
