# Test Configuration - H2 In-Memory Database
# This configuration allows integration tests to run without Docker/Testcontainers

# Application
spring.application.name=credit-application-service-test
server.port=0

# H2 Database (In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (use schema.sql instead)
spring.flyway.enabled=false

# JWT Configuration (same as prod for consistency)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# External Services (mock in tests)
external.risk-service.url=http://localhost:${wiremock.server.port:8081}

# Actuator (minimal for tests)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Disable Spring SQL initialization (use JPA ddl-auto instead)
spring.sql.init.mode=never

# Logging (reduced for tests)
logging.level.root=WARN
logging.level.com.prueba.credit_application_service=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG

# Disable Open-in-View (best practice)
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
